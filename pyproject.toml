[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsme-carbon-accounting"
version = "1.3.0"
description = "European VS (VSME) Sustainability Standard Carbon Accounting CLI & Open-Source Data Schemas"
readme = "README.md"
authors = [
  { name = "ExecutESG Editorial Team", email = "info@executesg.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial :: Accounting"
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://executesg.com"
Documentation = "https://executesg.com/resources/blog"
"Knowledge Hub" = "https://executesg.com/resources/blog"
"Digital Template" = "https://executesg.com/vsme-reporting-template"
Repository = "https://github.com/bemehrbani/vsme-sustainability-framework"
"Issue Tracker" = "https://github.com/bemehrbani/vsme-sustainability-framework/issues"

[project.scripts]
vsme-calc = "tools.carbon_accounting_calculator:main"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.setuptools.package-data]
"*" = ["schemas/*.json", "templates/*.csv"]
